<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hair Stylist | 韓系質感沙龍</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Maison de Hair</div>
        <nav>
            <a href="#about">關於</a>
            <a href="#trending">精選</a>
            <a href="#booking" class="btn-primary">線上預約</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Natural &<br>Elegant.</h1>
            <p>尋找屬於你的溫柔輪廓，打造不費力的日常精緻感。</p>
            <a href="#booking" class="btn-primary">預約諮詢</a>
        </div>
    </section>

    <section id="trending" class="trending-section">
        <h2>Trending Styles</h2>
        <p class="subtitle">本季推薦韓系燙染風格</p>
        
        <div class="scroll-hint">
        <span>← 左右滑動觀看更多 →</span>
    </div>

        <div class="item-group">
            <div class="item">
                <img src="https://images.unsplash.com/photo-1595959183082-7b570b7e08e2?auto=format&fit=crop&w=400" alt="木馬捲">
                <p>韓系木馬捲</p>
            </div>
            <div class="item">
                <img src="https://images.unsplash.com/photo-1600948836101-f9ffda59d250?auto=format&fit=crop&w=400" alt="氣墊燙">
                <p>慵懶氣墊燙</p>
            </div>
            <div class="item">
                <img src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=400" alt="耳圈染">
                <p>質感茶棕色</p>
            </div>
            <div class="item">
                <img src="https://images.unsplash.com/photo-1617897903246-719242758050?auto=format&fit=crop&w=400" alt="層次剪">
                <p>輕盈層次剪</p>
            </div>
        </div>
    </section>
<script>
    const slider = document.querySelector('.item-group');
    let isDown = false;
    let startX;
    let scrollLeft;

    // 滑鼠按下去
    slider.addEventListener('mousedown', (e) => {
        isDown = true;
        startX = e.pageX - slider.offsetLeft;
        scrollLeft = slider.scrollLeft;
    });

    // 滑鼠離開範圍
    slider.addEventListener('mouseleave', () => {
        isDown = false;
    });

    // 滑鼠放開
    slider.addEventListener('mouseup', () => {
        isDown = false;
    });

    // 滑鼠移動 (拖曳中)
    slider.addEventListener('mousemove', (e) => {
        if (!isDown) return; // 如果沒有按住就停止執行
        e.preventDefault();
        const x = e.pageX - slider.offsetLeft;
        const walk = (x - startX) * 1.5; // 數字 1.5 是滑動的靈敏度，可依喜好調整
        slider.scrollLeft = scrollLeft - walk;
    });
</script>
</body>
</html>
